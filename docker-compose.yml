version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyberai_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - LOG_LEVEL=INFO
    env_file:
      # Will load ANTHROPIC_API_KEY from backend/.env if it exists
      - ./backend/.env
    volumes:
      # Mount the database to persist SQLite alerts across container restarts
      - ./backend/database:/app/database
      
  # Optional frontend service for production
  frontend:
    image: node:20-alpine
    container_name: cyberai_frontend
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    command: sh -c "npm i -g pnpm && pnpm install && pnpm dev --host 0.0.0.0"
    depends_on:
      - backend
